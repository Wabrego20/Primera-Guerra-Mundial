<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primera Guerra Mundial | Revista Digital</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- =========== PORTADA ======================== -->
    <main class="portada">
        <!-- Encabezado -->
        <header class="encabezado">
            <div class="etiqueta">Primera Guerra Mundial 1914 - 1918</div>
        </header>
        <!-- ======= MENÚ =========================== -->
        <div class="botones">

            <!-- 1: PORTADA -->
            <button class="boton-seccion boton-imagen" data-titulo="Portada" data-icono="📚" data-pagina="01.png"
                data-descripcion="Portada de la revista digital sobre la Primera Guerra Mundial, con los datos de los estudiantes, la materia, el grado, la profesora y la fecha de entrega.">
                <img src="01.png" alt="Portada">
            </button>


            <!-- 2: ¿QUÉ FUE? -->
            <button class="boton-seccion boton-imagen" data-titulo="¿Qué fue la Primera Guerra Mundial?" data-icono="📖"
                data-pagina="02.png"
                data-descripcion="Conoce qué fue la Primera Guerra Mundial y el contexto general en el que se desarrolló el conflicto.">
                <img src="02.png" alt="¿Qué fue la Primera Guerra Mundial?">
            </button>


            <!-- 3: PRINCIPALES CAUSAS -->
            <button class="boton-seccion boton-imagen" data-titulo="Principales causas" data-icono="⚔️"
                data-pagina="03.png"
                data-descripcion="Descubre las principales causas que llevaron al estallido de la Primera Guerra Mundial.">
                <img src="03.png" alt="Principales causas">
            </button>


            <!-- 4: EL DETONANTE -->
            <button class="boton-seccion boton-imagen" data-titulo="El detonante" data-icono="💥" data-pagina="04.png"
                data-descripcion="Conoce el acontecimiento que desencadenó directamente el inicio de la Primera Guerra Mundial.">
                <img src="04.png" alt="El detonante">
            </button>


            <!-- 5: DESARROLLO -->
            <button class="boton-seccion boton-imagen" data-titulo="Desarrollo de la guerra" data-icono="🪖"
                data-pagina="05.png"
                data-descripcion="Recorre las principales etapas y acontecimientos del desarrollo de la Primera Guerra Mundial.">
                <img src="05.png" alt="Desarrollo de la guerra">
            </button>


            <!-- 6: NUEVAS TECNOLOGÍAS -->
            <button class="boton-seccion boton-imagen" data-titulo="La guerra y sus nuevas tecnologías" data-icono="✈️"
                data-pagina="06.png"
                data-descripcion="Descubre las nuevas tecnologías militares utilizadas durante la Primera Guerra Mundial.">
                <img src="06.png" alt="Nuevas tecnologías">
            </button>


            <!-- 7: FINAL -->
            <button class="boton-seccion boton-imagen" data-titulo="El final de la guerra" data-icono="🕊️"
                data-pagina="07.png"
                data-descripcion="Conoce cómo terminó la Primera Guerra Mundial y el armisticio de 1918.">
                <img src="07.png" alt="El final de la guerra">
            </button>


            <!-- 8: CONSECUENCIAS -->
            <button class="boton-seccion boton-imagen" data-titulo="Consecuencias" data-icono="🌍" data-pagina="08.png"
                data-descripcion="Explora las consecuencias políticas, económicas, sociales y territoriales que dejó la Primera Guerra Mundial.">
                <img src="08.png" alt="Consecuencias">
            </button>


            <!-- 9: CONCLUSIONES Y REFERENCIAS -->
            <button class="boton-seccion boton-imagen" data-titulo="Conclusiones y Referencias" data-icono="💡"
                data-pagina="09.png"
                data-descripcion="Consulta las conclusiones de la revista y las referencias utilizadas para la elaboración del proyecto.">
                <img src="09.png" alt="Conclusiones y Referencias">
            </button>

        </div>

        <!-- ====VIDEOS DE LA PRESENTACIÓN======= -->
        <div class="videos-presentacion">
            <!-- VIDEO 1 -->
            <button class="video-card" data-video="video1.mp4" data-titulo="Presentación 1"
                data-descripcion="Video de presentación de la Primera Guerra Mundial.">
                <span class="video-icono">▶</span>
                <span class="video-titulo">Video 1</span>
                <span class="video-texto">Ver presentación</span>
            </button>

            <!-- VIDEO 2 -->
            <button class="video-card" data-video="video2.mp4" data-titulo="Presentación 2"
                data-descripcion="Segundo video de presentación.">
                <span class="video-icono">▶</span>
                <span class="video-titulo">Video 2</span>
                <span class="video-texto">Ver presentación</span>
            </button>

            <!-- VIDEO 3 -->
            <button class="video-card" data-video="video3.mp4" data-titulo="Presentación 3"
                data-descripcion="Tercer video de presentación.">
                <span class="video-icono">▶</span>
                <span class="video-titulo">Video 3</span>
                <span class="video-texto">Ver presentación</span>
            </button>
        </div>
    </main>
    <!-- ================= FOOTER ================= -->
    <footer class="footer-contenido">
        <!-- Título -->
        <div class="footer-titulo">
            <h4>Revista Digital</h4>
            <h4>Primera Guerra Mundial 1914 — 1918</h4>
        </div>
        <h6>© 2026 Todos los derechos reservados. Alexa Carrillo, Jasmira Guerrero y Angelina Best</h6>
    </footer>

    <!-- ===== MODAL PARA LOS VIDEOS ===== -->
    <div class="modal" id="modal">
        <div class="modal-contenido">
            <div class="modal-icono" id="modalIcono">▶</div>
            <h2 id="modalTitulo">Video</h2>
            <p id="modalDescripcion">Video de presentación.</p>
            <video id="modalVideo" controls playsinline
                style="width: 100%; max-height: 60vh; border-radius: 10px; margin-bottom: 20px;">
                Tu navegador no soporta la reproducción de video.
            </video>
            <button class="cerrar" id="cerrarModal">Cerrar</button>
        </div>
    </div>

    <!-- ======MODAL PARA LAS PÁGINAS DE LA REVISTA================== -->
    <div class="modal-pagina" id="modalPagina">
        <div class="pagina-contenedor">
            <!-- Botón cerrar -->
            <button class="cerrar-pagina" id="cerrarPagina" aria-label="Cerrar página">X</button>
            <!-- Imagen de la página -->
            <img id="imagenPagina" src="" alt="Página de la revista">
        </div>
    </div>
    <!-- ========= JAVASCRIPT ======================= -->
    <script>

        /* =====================================================
           ELEMENTOS DEL MODAL NORMAL
        ===================================================== */

        const botones = document.querySelectorAll(".boton-seccion");

        const modal = document.getElementById("modal");
        const modalTitulo = document.getElementById("modalTitulo");
        const modalIcono = document.getElementById("modalIcono");
        const modalDescripcion = document.getElementById("modalDescripcion");
        const cerrarModal = document.getElementById("cerrarModal");


        /* =====================================================
           ELEMENTOS DEL VISOR DE PÁGINAS
        ===================================================== */

        const modalPagina = document.getElementById("modalPagina");
        const imagenPagina = document.getElementById("imagenPagina");
        const cerrarPagina = document.getElementById("cerrarPagina");


        /* =====================================================
           BOTONES DE LAS SECCIONES
           01.png - 09.png
        ===================================================== */

        botones.forEach(boton => {

            boton.addEventListener("click", () => {

                const pagina = boton.dataset.pagina;

                /* Si el botón tiene una imagen asociada,
                   la mostramos dentro del visor */

                if (pagina) {

                    imagenPagina.src = pagina;
                    imagenPagina.alt = boton.dataset.titulo;

                    modalPagina.classList.add("activo");

                    /* Evita que la portada se desplace
                       mientras el visor está abierto */

                    document.body.style.overflow = "hidden";
                }

            });

        });


        /* =====================================================
           CERRAR EL VISOR CON EL BOTÓN X
        ===================================================== */

        cerrarPagina.addEventListener("click", () => {

            modalPagina.classList.remove("activo");

            imagenPagina.src = "";

            document.body.style.overflow = "";

        });


        /* =====================================================
           CERRAR EL VISOR AL HACER CLIC FUERA
        ===================================================== */

        modalPagina.addEventListener("click", (evento) => {

            if (evento.target === modalPagina) {

                modalPagina.classList.remove("activo");

                imagenPagina.src = "";

                document.body.style.overflow = "";
            }

        });


        /* =====================================================
           CERRAR EL VISOR CON ESC
        ===================================================== */

        document.addEventListener("keydown", (evento) => {

            if (
                evento.key === "Escape" &&
                modalPagina.classList.contains("activo")
            ) {

                modalPagina.classList.remove("activo");

                imagenPagina.src = "";

                document.body.style.overflow = "";
            }

        });


        /* =====================================================
           ELEMENTOS DE LOS VIDEOS
        ===================================================== */

        const videos = document.querySelectorAll(".video-card");

        const modalVideo = document.getElementById("modalVideo");


        /* =====================================================
           ABRIR LOS VIDEOS EN EL MODAL
        ===================================================== */

        videos.forEach(video => {

            video.addEventListener("click", () => {

                const archivo = video.dataset.video;
                const titulo = video.dataset.titulo;
                const descripcion = video.dataset.descripcion;

                /* Información del modal */

                modalTitulo.textContent = titulo;
                modalIcono.textContent = "▶";
                modalDescripcion.textContent = descripcion;

                /* Cargar el video */

                modalVideo.src = archivo;

                /* Mostrar modal */

                modal.classList.add("activo");

                /* Evitar desplazamiento de la página */

                document.body.style.overflow = "hidden";

                /* Intentar reproducir automáticamente */

                modalVideo.play().catch(() => { });

            });

        });


        /* =====================================================
           CERRAR MODAL DE VIDEOS
        ===================================================== */

        cerrarModal.addEventListener("click", () => {

            modal.classList.remove("activo");

            /* Detener y limpiar el video */

            modalVideo.pause();
            modalVideo.currentTime = 0;
            modalVideo.src = "";

            document.body.style.overflow = "";

        });


        /* =====================================================
           CERRAR MODAL AL HACER CLIC FUERA
        ===================================================== */

        modal.addEventListener("click", (evento) => {

            if (evento.target === modal) {

                modal.classList.remove("activo");

                /* Detener el video */

                modalVideo.pause();
                modalVideo.currentTime = 0;
                modalVideo.src = "";

                document.body.style.overflow = "";
            }

        });


        /* =====================================================
           CERRAR MODAL DE VIDEO CON ESC
        ===================================================== */

        document.addEventListener("keydown", (evento) => {

            if (
                evento.key === "Escape" &&
                modal.classList.contains("activo")
            ) {

                modal.classList.remove("activo");

                /* Detener el video */

                modalVideo.pause();
                modalVideo.currentTime = 0;
                modalVideo.src = "";

                document.body.style.overflow = "";
            }

        });

    </script>
</body>

</html>
