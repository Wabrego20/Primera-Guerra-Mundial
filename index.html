<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primera Guerra Mundial | Revista Digital</title>
    <style>
        /* ===========VARIABLES DE COLOR=============== */
        :root {

            --azul-oscuro: #102b49;
            --azul: #183b61;
            --rojo: #a32626;
            --rojo-claro: #c43a35;
            --crema: #f3ead8;
            --blanco: #ffffff;
            --texto: #172536;
            --gris: #d8d2c7;
            --sombra: rgba(0, 0, 0, 0.35);
            --transicion: 0.3s ease;
        }

        /* =====CONFIGURACIÓN GENERAL================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
            background: var(--azul-oscuro);
            color: var(--texto);
        }

        /* ==========PORTADA=============== */
        .portada {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(to bottom,
                    var(--crema),
                    var(--gris));
        }

        /* =====CAPA OSCURA SUAVE=============== */
        .portada::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(to bottom,
                    rgba(0, 0, 0, 0.05),
                    rgba(0, 0, 0, 0.20));
            pointer-events: none;
        }

        /* ========ENCABEZADO=============== */

        .encabezado {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .etiqueta {
            padding: 10px 22px;
            background: rgba(16, 43, 73, 0.90);
            color: var(--blanco);
            border-left: 5px solid var(--rojo);
            border-right: 5px solid var(--rojo);
            border-radius: 5px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 5px 15px var(--sombra);
        }

        /* ======MENÚ INTERACTIVO============== */
        .menu-revista {
            position: relative;
            z-index: 5;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .botones {
            width: 95%;
            display: flex;
            justify-content: center;
            align-items: stretch;
            flex-wrap: wrap;
            gap: 10px;
            padding: 15px;
            border: 2px solid;
        }

        /* =======TARJETAS DE LAS SECCIONES======= */

        .boton-seccion {
            position: relative;

            /* Distribución */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;

            /* Tamaño */
            flex: 1 1 180px;
            min-width: 160px;
            max-width: 220px;
            min-height: 125px;

            /* Espaciado */
            padding: 20px 15px;

            /* Borde */
            border: 2px solid var(--gris);
            border-radius: 14px;

            /* Fondo */
            background: linear-gradient(145deg,
                    var(--azul-oscuro),
                    var(--azul));

            /* Texto */
            color: var(--blanco);
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;

            /* Interacción */
            cursor: pointer;

            /* Sombra */
            box-shadow: 0 7px 18px var(--sombra);

            /* Transiciones */
            transition:
                transform var(--transicion),
                background var(--transicion),
                box-shadow var(--transicion),
                border-color var(--transicion);
            overflow: hidden;
        }


        /* Línea roja superior */
        .boton-seccion::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: var(--rojo);
            transition: height var(--transicion);
        }

        /* ====ICONO====================== */

        .boton-seccion .icono {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--crema);
            color: var(--azul-oscuro);
            font-size: 25px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
            transition:
                transform var(--transicion),
                background var(--transicion);
        }


        /* ==========EFECTO HOVER============ */

        .boton-seccion:hover {
            transform: translateY(-8px);
            background: linear-gradient(145deg,
                    var(--rojo),
                    var(--rojo-claro));
            border-color: var(--blanco);
            box-shadow: 0 14px 28px var(--sombra);
        }


        /* Animación de la línea superior */
        .boton-seccion:hover::before {
            height: 100%;
            opacity: 0.08;
        }

        /* Animación del icono */
        .boton-seccion:hover .icono {
            transform: scale(1.12) rotate(-5deg);
            background: var(--blanco);
        }

        /* =====EFECTO AL HACER CLICK========== */

        .boton-seccion:active {
            transform: translateY(-3px) scale(0.98);
        }

        /* =======RESPONSIVE================ */

        @media (max-width: 600px) {

            .boton-seccion {
                width: 100%;
                max-width: none;
                min-height: 90px;
                flex-direction: row;
                justify-content: flex-start;
                padding: 15px 20px;
            }

            .boton-seccion .icono {
                flex-shrink: 0;
            }
        }

        /* ========ICONOS============== */
        .icono {
            font-size: 20px;
            line-height: 1;
        }

        

        .boton-entrar:hover {
            background: var(--azul-oscuro);
            transform: translateY(-5px);
            box-shadow: 0 12px 30px var(--sombra);
        }

        /* =======VENTANA MODAL=============== */

        .modal {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: var(--sombra);
            backdrop-filter: blur(5px);
        }

        .modal.activo {
            display: flex;
        }

        .modal-contenido {
            width: min(600px, 100%);
            padding: 35px;
            background: var(--crema);
            border-top: 8px solid var(--rojo);
            border-bottom: 8px solid var(--azul-oscuro);
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 20px 50px var(--sombra);
            animation: aparecer 0.3s ease;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: scale(0.85);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-icono {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .modal h2 {
            color: var(--azul-oscuro);
            margin-bottom: 12px;
            font-family: Georgia, serif;
        }

        .modal p {
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .cerrar {
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            background: var(--rojo);
            color: var(--blanco);
            font-weight: bold;
            cursor: pointer;
        }

        .cerrar:hover {
            background: var(--azul-oscuro);
        }

        /* =========RESPONSIVE=============== */
        @media (max-width: 900px) {
            .portada {
                padding: 20px;
                background-position: center;
            }

            .botones {
                gap: 8px;
            }

            .boton-seccion {
                flex: 1 1 30%;
                font-size: 12px;
            }
        }

        @media (max-width: 600px) {
            .portada {
                min-height: 100vh;
                padding: 12px;
                background-position: center;
            }

            .etiqueta {
                font-size: 10px;
                padding: 8px 12px;
            }

            .botones {
                flex-direction: column;
                width: 100%;
            }

            .boton-seccion {
                width: 100%;
                min-height: 45px;
            }

            .boton-entrar {
                width: 90%;
                min-width: 0;
            }
        }

        /* ========VISOR DE PÁGINAS DE LA REVISTA========== */
        .modal-pagina {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 30px;
            background: var(--sombra);
            backdrop-filter: blur(6px);
        }

        /* Cuando está activo */
        .modal-pagina.activo {
            display: flex;
        }

        /* ===========CONTENEDOR DE LA IMAGEN================ */
        .pagina-contenedor {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: min(1400px, 95vw);
            height: min(90vh, 900px);
            padding: 20px;
            background: var(--crema);
            border-top: 8px solid var(--rojo);
            border-bottom: 8px solid var(--azul-oscuro);
            border-radius: 14px;
            box-shadow: 0 25px 60px var(--sombra);
            animation: aparecerPagina 0.35s ease;
        }

        /* =======IMAGEN==================== */
        .pagina-contenedor img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
            border-radius: 5px;
            box-shadow: 0 8px 25px var(--sombra);
        }

        /* ========BOTÓN CERRAR================= */
        .cerrar-pagina {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 10;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid var(--blanco);
            border-radius: 50%;
            background: var(--rojo);
            color: var(--blanco);
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px var(--sombra);
            transition: var(--transicion);
        }

        .cerrar-pagina:hover {
            background: var(--azul-oscuro);
            transform: rotate(90deg) scale(1.08);
        }

        /* =====ANIMACIÓN========================= */

        @keyframes aparecerPagina {
            from {
                opacity: 0;
                transform: scale(0.88);
            }

            to {
                opacity: 1;
                transform: scale(1);

            }
        }

        /* ======RESPONSIVE===================== */
        @media (max-width: 700px) {
            .modal-pagina {
                padding: 10px;
            }

            .pagina-contenedor {
                width: 100%;
                height: 90vh;
                padding: 10px;
                border-top-width: 5px;
                border-bottom-width: 5px;
            }

            .cerrar-pagina {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }
        }
    </style>
</head>

<body>
    <!-- =========== PORTADA ======================== -->
    <main class="portada">
        <!-- Encabezado -->
        <header class="encabezado">

            <div class="etiqueta">

                Revista Digital · Historia

            </div>

        </header>
        <!-- ======= MENÚ =========================== -->
        <section class="menu-revista">
            <div class="botones">

                <!-- 1: PORTADA -->
                <button class="boton-seccion" data-titulo="Portada" data-icono="📚" data-pagina="01.png"
                    data-descripcion="Portada de la revista digital sobre la Primera Guerra Mundial, con los datos de los estudiantes, la materia, el grado, la profesora y la fecha de entrega.">
                    <span class="icono">📚</span>
                    <span>Portada</span>
                </button>


                <!-- 2: ¿QUÉ FUE? -->
                <button class="boton-seccion" data-titulo="¿Qué fue la Primera Guerra Mundial?" data-icono="📖"
                    data-pagina="02.png"
                    data-descripcion="Conoce qué fue la Primera Guerra Mundial y el contexto general en el que se desarrolló el conflicto.">
                    <span class="icono">📖</span>
                    <span>¿Qué fue?</span>
                </button>


                <!-- 3: PRINCIPALES CAUSAS -->
                <button class="boton-seccion" data-titulo="Principales causas" data-icono="⚔️" data-pagina="03.png"
                    data-descripcion="Descubre las principales causas que llevaron al estallido de la Primera Guerra Mundial.">
                    <span class="icono">⚔️</span>
                    <span>Principales causas</span>
                </button>


                <!-- 4: EL DETONANTE -->
                <button class="boton-seccion" data-titulo="El detonante" data-icono="💥" data-pagina="04.png"
                    data-descripcion="Conoce el acontecimiento que desencadenó directamente el inicio de la Primera Guerra Mundial.">
                    <span class="icono">💥</span>
                    <span>El detonante</span>
                </button>


                <!-- 5: DESARROLLO -->
                <button class="boton-seccion" data-titulo="Desarrollo de la guerra" data-icono="🪖" data-pagina="05.png"
                    data-descripcion="Recorre las principales etapas y acontecimientos del desarrollo de la Primera Guerra Mundial.">
                    <span class="icono">🪖</span>
                    <span>Desarrollo</span>
                </button>


                <!-- 6: NUEVAS TECNOLOGÍAS -->
                <button class="boton-seccion" data-titulo="La guerra y sus nuevas tecnologías" data-icono="✈️"
                    data-pagina="06.png"
                    data-descripcion="Descubre las nuevas tecnologías militares utilizadas durante la Primera Guerra Mundial.">
                    <span class="icono">✈️</span>
                    <span>Nuevas tecnologías</span>
                </button>


                <!-- 7: FINAL -->
                <button class="boton-seccion" data-titulo="El final de la guerra" data-icono="🕊️" data-pagina="07.png"
                    data-descripcion="Conoce cómo terminó la Primera Guerra Mundial y el armisticio de 1918.">
                    <span class="icono">🕊️</span>
                    <span>El final</span>
                </button>


                <!-- 8: CONSECUENCIAS -->
                <button class="boton-seccion" data-titulo="Consecuencias" data-icono="🌍" data-pagina="08.png"
                    data-descripcion="Explora las consecuencias políticas, económicas, sociales y territoriales que dejó la Primera Guerra Mundial.">
                    <span class="icono">🌍</span>
                    <span>Consecuencias</span>
                </button>


                <!-- 9: CONCLUSIONES Y REFERENCIAS -->
                <button class="boton-seccion" data-titulo="Conclusiones y Referencias" data-icono="💡"
                    data-pagina="09.png"
                    data-descripcion="Consulta las conclusiones de la revista y las referencias utilizadas para la elaboración del proyecto.">
                    <span class="icono">💡</span>
                    <span>Conclusiones y Referencias</span>
                </button>

            </div>
        </section>

        <!-- ====BOTÓN PRINCIPAL=================== -->
        <button class="boton-entrar" id="entrarRevista">
            COMENZAR LA REVISTA
            <span>→</span>
        </button>
    </main>

    <!-- =====MODAL========== -->
    <div class="modal" id="modal">
        <div class="modal-contenido">
            <div class="modal-icono" id="modalIcono">📖</div>
            <h2 id="modalTitulo">Sección</h2>
            <p id="modalDescripcion">Descripción de la sección.</p>
            <button class="cerrar" id="cerrarModal">Cerrar</button>
        </div>
    </div>

    <!-- ======MODAL PARA LAS PÁGINAS DE LA REVISTA================== -->
    <div class="modal-pagina" id="modalPagina">
        <div class="pagina-contenedor">
            <!-- Botón cerrar -->
            <button class="cerrar-pagina" id="cerrarPagina" aria-label="Cerrar página">X</button>
            <!-- Imagen de la página -->
            <img id="imagenPagina" src="" alt="Página de la revista">
        </div>
    </div>

    <!-- =========JAVASCRIPT======================= -->
    <script>
        /* ==ELEMENTOS DEL MODAL NORMAL======== */
        const botones = document.querySelectorAll(".boton-seccion");
        const modal = document.getElementById("modal");
        const modalTitulo = document.getElementById("modalTitulo");
        const modalIcono = document.getElementById("modalIcono");
        const modalDescripcion = document.getElementById("modalDescripcion");
        const cerrarModal = document.getElementById("cerrarModal");
        const entrarRevista = document.getElementById("entrarRevista");

        /* =====ELEMENTOS DEL VISOR DE PÁGINAS========= */
        const modalPagina = document.getElementById("modalPagina");
        const imagenPagina = document.getElementById("imagenPagina");
        const cerrarPagina = document.getElementById("cerrarPagina");
        /* =======BOTONES DE LAS SECCIONES====== */
        botones.forEach(boton => {
            boton.addEventListener("click", () => {
                const pagina = boton.dataset.pagina;
                /* Si el botón tiene una imagen asociada, la mostramos dentro del modal.*/
                if (pagina) {
                    imagenPagina.src = pagina;
                    imagenPagina.alt = boton.dataset.titulo;
                    modalPagina.classList.add("activo");
                    /* Evita que la portada se desplace mientras el visor está abierto. */
                    document.body.style.overflow = "hidden";
                }
            });
        });

        /* ======CERRAR EL VISOR CON EL BOTÓN X======= */
        cerrarPagina.addEventListener("click", () => {
            modalPagina.classList.remove("activo");
            imagenPagina.src = "";
            document.body.style.overflow = "";
        });

        /* =========CERRAR EL VISOR AL HACER CLIC FUERA===== */
        modalPagina.addEventListener("click", (evento) => {
            if (evento.target === modalPagina) {
                modalPagina.classList.remove("activo");
                imagenPagina.src = "";
                document.body.style.overflow = "";
            }
        });
        /* ========CERRAR EL VISOR CON ESC====== */
        document.addEventListener("keydown", (evento) => {
            if (
                evento.key === "Escape" &&
                modalPagina.classList.contains("activo")
            ) {
                modalPagina.classList.remove("activo");
                imagenPagina.src = "";
                document.body.style.overflow = "";
            }
        });
        /* ====CERRAR MODAL NORMAL============ */
        cerrarModal.addEventListener("click", () => {
            modal.classList.remove("activo");
        });
        /* ===CERRAR MODAL NORMAL AL HACER CLIC FUERA========== */
        modal.addEventListener("click", (evento) => {
            if (evento.target === modal) {
                modal.classList.remove("activo");
            }
        });

        /* =======BOTÓN COMENZAR======================= */
        entrarRevista.addEventListener("click", () => {
            modalTitulo.textContent = "¡Bienvenido a la revista!";
            modalIcono.textContent = "📖";
            modalDescripcion.textContent = "Aquí comenzará el recorrido interactivo por la Primera Guerra Mundial.";
            modal.classList.add("activo");
        });
    </script>
</body>

</html>
